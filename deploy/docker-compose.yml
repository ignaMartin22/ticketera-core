name: ticketjuy

services:
  db:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=64MB -c max_connections=20
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo loopback: los puertos publicados por Docker saltean el firewall.
      - "127.0.0.1:${WEB_PORT:-8001}:8000"
    volumes:
      # Portadas de las fechas que suben los dueños. Las guarda deploy/backup.sh.
      - media:/app/media
    mem_limit: 256m
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput && exec gunicorn ticketera.wsgi:application
        --bind 0.0.0.0:8000 --workers 2 --timeout 30
        --max-requests 500 --max-requests-jitter 50
        --access-logfile - --error-logfile -
    networks: [internal]
    logging: *logging

volumes:
  pgdata:
  media:

networks:
  internal:
