<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagar con Macro Click de Pago</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05040a; color: #f6f6f6;
           font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    button { margin-top: 1rem; min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: 999px;
             background: #f6f6f6; color: #05040a; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <form id="pago" method="post" action="{{ action }}">
    {% for name, value in fields.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <p>Te estamos llevando a Macro Click de Pago…</p>
    <noscript><p>Si no avanza solo, tocá el botón.</p></noscript>
    <button type="submit">Ir a pagar</button>
  </form>
  <script>document.getElementById("pago").submit();</script>
</body>
</html>
