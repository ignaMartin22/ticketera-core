<div class="field{% if field.errors %} field-error{% endif %}{% if field.field.widget.input_type == 'radio' %} field-radio{% endif %}">
  {% if field.field.widget.input_type == 'radio' %}
    <fieldset>
      <legend>{{ field.label }}</legend>
      {% for choice in field %}<label class="choice">{{ choice.tag }} {{ choice.choice_label }}</label>{% endfor %}
    </fieldset>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">(opcional)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
